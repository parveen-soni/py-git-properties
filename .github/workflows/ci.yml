name: CI

on:
  push:
    branches: ["main", "master", "task/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify CLI commands
        run: |
          py-git-properties --version
          git-properties --version
          git-contribution-info --version
          py-git-properties --print --format properties
          py-git-properties --print --format json
          py-git-properties --print --format flat-json

      - name: Run unit test suite
        run: |
          python -m unittest discover tests -v
